services:
  - type: web
    name: lyuda-bielousova-music
    env: python
    buildCommand: "pip install -r requirements.txt && npm install --prefix frontend && npm run build --prefix frontend"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
